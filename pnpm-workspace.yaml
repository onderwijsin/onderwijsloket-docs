allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true

catalog:
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@onderwijsin/docus-plus": 1.3.1
  "@semantic-release/changelog": 6.0.3
  "@semantic-release/commit-analyzer": 13.0.1
  "@semantic-release/git": 10.0.1
  "@semantic-release/github": 12.0.9
  "@semantic-release/npm": 13.1.5
  "@semantic-release/release-notes-generator": 14.1.1
  "@varlock/proton-pass-plugin": 2.0.0
  "@varlock/vite-integration": 1.2.1
  husky: 9.1.7
  lint-staged: 17.0.8
  nuxt: 4.4.8
  nuxtseo-layer-devtools: 5.3.2
  oxfmt: 0.58.0
  oxlint: 1.73.0
  prettier-plugin-mdc: 0.2.1
  semantic-release: 25.0.5
  varlock: 1.10.0
  vue-tsc: 3.3.7
  zod: 4.4.3

minimumReleaseAgeExclude:
  - "@onderwijsin/docus-plus"

catalogMode: "strict"
cleanupUnusedCatalogs: true
onlyBuiltDependencies:
  - better-sqlite3
  - sharp

saveExact: true
shamefullyHoist: true

registries:
  default: https://registry.npmjs.org/
  "@onderwijsin": https://registry.npmjs.org/
